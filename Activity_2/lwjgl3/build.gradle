plugins {
    id 'application'
}

// Keep one asset tree: IDE classpaths, Gradle runs and distributions all receive these resources.
sourceSets.main.resources {
    srcDir rootProject.file('assets')
    exclude '**/.DS_Store', '**/.gitkeep', 'art_resources/**'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // LibGDX 1.14.2 defaults to LWJGL 3.3.3. LWJGL 3.4+ is required for JDK 25.
    constraints {
        implementation "org.lwjgl:lwjgl:${lwjgl3Version}"
        implementation "org.lwjgl:lwjgl-glfw:${lwjgl3Version}"
        implementation "org.lwjgl:lwjgl-jemalloc:${lwjgl3Version}"
        implementation "org.lwjgl:lwjgl-openal:${lwjgl3Version}"
        implementation "org.lwjgl:lwjgl-opengl:${lwjgl3Version}"
        implementation "org.lwjgl:lwjgl-stb:${lwjgl3Version}"
    }
}

application {
    mainClass = 'au.edu.anu.comp2120.lwjgl3.Lwjgl3Launcher'
    // Generated distribution scripts also need the native-access/macOS startup options.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        applicationDefaultJvmArgs += '-XstartOnFirstThread'
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}
