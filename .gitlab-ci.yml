# ANU's shared teaching runners only accept jobs tagged for a course.
default:
  tags:
    - comp2120

stages:
  - test
  - secret-detection

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-cache"

secret_detection:
  stage: secret-detection

gradle-build:
  stage: test
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - Activity_2/gradle/wrapper/gradle-wrapper.properties
        - Activity_2/build.gradle
    paths:
      - .gradle-cache/caches
      - .gradle-cache/wrapper
  script:
    - cd Activity_2
    - ./gradlew clean build javadocAudit :core:jacocoTestReport --no-daemon
  artifacts:
    when: always
    paths:
      - "Activity_2/*/build/reports/tests/test/"
      - "Activity_2/core/build/reports/jacoco/test/"
    reports:
      junit:
        - "Activity_2/*/build/test-results/test/*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "Activity_2/core/build/reports/jacoco/test/jacocoTestReport.xml"
