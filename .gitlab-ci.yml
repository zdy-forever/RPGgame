# ANU's shared teaching runners only accept jobs tagged for a course.
default:
  tags:
    - comp2120

stages:
  - test
  - secret-detection

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection
